# TenderOS: Postgres, the Python engine and the Next.js web app. Only the web app is published;
# it signs users in and forwards /api/* to the engine. Fill .env from .env.example first.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tenderos
      POSTGRES_USER: tenderos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderos -d tenderos"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: deploy/engine.Dockerfile
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-}
      EXTRACTION_REQUIRE_LLM: ${EXTRACTION_REQUIRE_LLM:-}
      # tender sets: amendment and clarification tables (Docling), scanned pages (LlamaParse)
      DOCLING_URL: ${DOCLING_URL-http://docling:5001}
      LLAMA_CLOUD_API_KEY: ${LLAMA_CLOUD_API_KEY:-}
    volumes:
      - extraction_jobs:/data/extraction_jobs
    restart: unless-stopped

  # Docling (IBM) layout and table models behind docling-serve, CPU build; the engine reads a
  # tender set's tables through it and falls back to PyMuPDF when it is down. Not published.
  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.35.0
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_MAX_SYNC_WAIT: "600"
      UVICORN_WORKERS: "1"
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_started
    environment:
      DATABASE_URL: postgres://tenderos:${POSTGRES_PASSWORD}@db:5432/tenderos
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ENGINE_URL: http://engine:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # the SECI RTC bid agent (GPT-Live); the key stays on the server
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_LIVE_BACKEND_MODEL: ${OPENAI_LIVE_BACKEND_MODEL:-}
      OPENAI_LIVE_VOICE: ${OPENAI_LIVE_VOICE:-}
      # the MCP server for Claude connectors at /api/mcp/<MCP_TOKEN> (docs/MCP.md); off when unset
      MCP_TOKEN: ${MCP_TOKEN:-}
      # team sharing: files people upload (signed copies) and the email that tells them of work
      FILES_DIR: /data/files
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_URL: ${APP_URL:-}
      # enterprise zone flag and release version (docs/enterprise/ARCHITECTURE.md); shown by /api/health
      TENDEROS_ZONE: ${TENDEROS_ZONE:-all}
      TENDEROS_VERSION: ${TENDEROS_VERSION:-dev}
    volumes:
      - team_files:/data/files
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  db:
  extraction_jobs:
  team_files:
